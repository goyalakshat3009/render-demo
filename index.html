<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock vs Mine Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #0f172a, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: white;
            max-width: 700px;
            width: 90%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.3);
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
        }

        .form-container input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .form-container input[type="text"]:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0px 0px 5px rgba(37, 99, 235, 0.5);
        }

        .form-container input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .form-container input[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        .result {
            font-size: 1.5em;
            color: #16a34a;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: gray;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Rock vs Mine Prediction</h2>

        <p class="subtitle">
            Enter all 60 sonar values to predict whether the object is a Rock or a Mine.
        </p>

        <form action="/predict" method="post">

            <div class="input-grid">

                {% for i in range(60) %}
                <input type="text" name="{{ i }}" placeholder="Feature {{ i+1 }}" required>
                {% endfor %}

            </div>

            <input type="submit" value="Predict">

        </form>

        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}

        <div class="footer">
            Machine Learning Project using Flask & Logistic Regression
        </div>

    </div>

</body>

</html>
